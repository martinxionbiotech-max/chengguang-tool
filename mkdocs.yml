site_name: Chengguang Battery Tools
site_url: https://tool.chengguangenergy.com/
site_description: Free interactive battery tools — finder, CCA calculator, JIS↔DIN cross-reference, runtime & life estimators. Built by Chengguang Power Tech, IATF 16949 certified OEM battery manufacturer.
theme:
  name: material
  custom_dir: overrides
  palette:
    primary: deep purple
    accent: purple
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  logo: null
  favicon: null

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js
  - javascripts/extra.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Battery Finder: finder/index.md
  - CCA Calculator: cca-calculator/index.md
  - JIS↔DIN Cross-Reference: cross-reference/index.md
  - Runtime Calculator: runtime-calculator/index.md
  - Life Estimator: life-estimator/index.md
  - Ah↔CCA Converter: ah-cca-converter/index.md
  - Terminal Guide: terminal-guide/index.md
  - Articles:
      - What is CCA?: articles/what-is-cca.md
      - Battery Life by Climate: articles/battery-life-by-climate.md
      - How to Test a Car Battery: articles/how-to-test-battery.md
      - Car Battery Buying Guide: articles/battery-buying-guide.md
      - Battery Maintenance Tips: articles/battery-maintenance.md

plugins:
  - search

docs_dir: docs
site_dir: site
