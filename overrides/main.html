{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}

  {# ─── Open Graph + Twitter ─── #}
  <meta property="og:site_name" content="{{ config.site_name }}" />
  <meta property="og:title" content="{% if page and not page.is_homepage %}{{ page.title }}{% else %}{{ config.site_name }}{% endif %}" />
  <meta property="og:description" content="{{ page.meta.description if page and page.meta and page.meta.description else config.site_description }}" />
  <meta property="og:url" content="{{ page.canonical_url if page and page.canonical_url else config.site_url }}" />
  <meta property="og:image" content="https://data.chengguangenergy.com/assets/og-default.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:type" content="{% if page and page.is_homepage %}website{% else %}article{% endif %}" />
  <meta property="og:locale" content="en_US" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{% if page and not page.is_homepage %}{{ page.title }}{% else %}{{ config.site_name }}{% endif %}" />
  <meta name="twitter:description" content="{{ page.meta.description if page and page.meta and page.meta.description else config.site_description }}" />
  <meta name="twitter:image" content="https://data.chengguangenergy.com/assets/og-default.png" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": "https://chengguangenergy.com/#organization",
    "name": "Chengguang Power Tech Co., Ltd.",
    "url": "https://chengguangenergy.com/",
    "logo": "https://data.chengguangenergy.com/assets/chengguang-logo.png",
    "description": "IATF 16949 certified OEM automotive battery manufacturer since 2002. 200,000 m² factory, 18 production lines, 40,000 batteries/day, exporting to 70+ countries.",
    "foundingDate": "2002",
    "address": {
      "@type": "PostalAddress",
      "addressLocality": "Jinzhou",
      "addressRegion": "Hebei",
      "addressCountry": "CN"
    },
    "areaServed": "Worldwide",
    "knowsAbout": [
      "Automotive Battery Manufacturing",
      "SLI Battery",
      "AGM Battery",
      "EFB Battery",
      "JIS Battery Standard",
      "DIN Battery Standard"
    ]
  }
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "@id": "https://tool.chengguangenergy.com/#website",
    "url": "https://tool.chengguangenergy.com/",
    "name": "Chengguang Battery Tools",
    "description": "{{ config.site_description }}",
    "publisher": { "@id": "https://chengguangenergy.com/#organization" }
  }
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebPage",
    "@id": "{{ page.canonical_url if page and page.canonical_url else config.site_url }}#webpage",
    "url": "{{ page.canonical_url if page and page.canonical_url else config.site_url }}",
    "name": "{{ page.title if page else config.site_name }}",
    "isPartOf": { "@id": "https://tool.chengguangenergy.com/#website" },
    "about": { "@id": "https://chengguangenergy.com/#organization" }
  }
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://tool.chengguangenergy.com/" },
      { "@type": "ListItem", "position": 2, "name": "{{ page.title if page else config.site_name }}", "item": "{{ page.canonical_url if page and page.canonical_url else config.site_url }}" }
    ]
  }
  </script>
{% endblock %}
